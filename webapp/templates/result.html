<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .result-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .result-container h2 {
            color: #333;
            margin-bottom: 10px;
        }
        .result-container p {
            color: #6d747c;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .image {
            width: 100%;
            max-width: 400px;
            height: auto;
            border: 2px solid #91979d;
            border-radius: 8px;
            margin-top: 20px;
        }
        .note {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        #chat-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
        }
        #chat-window {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            height: 400px;
            background-color: #ece6e6;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 10px;
            overflow-y: auto;
            flex-direction: column;
            border-radius: 6px;
        }
        #chat-content {
            flex: 1;
            overflow-y: auto;
        }
        .message {
            margin: 5px 0;
            padding: 10px;
            max-width: 85%;
            border-radius: 16px;
        }
        .user-message {
            background-color: #adffd9;
            align-self: flex-end;
        }
        .bot-message {
            background-color: #ecf9f2;
            align-self: flex-start;
        }
        #chat-input {
            width: calc(100% - 100px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 9px;
            margin-right: 5px;
        }
        button {
            width: 60px;
            border: none;
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            border-radius: 9px;
        }
        button:hover {
            background-color: #0056b3;
        }

        /* Custom scrollbar styling for WebKit browsers */
        #chat-content::-webkit-scrollbar {
            width: 8px; /* Width of the scrollbar */
        }

        #chat-content::-webkit-scrollbar-track {
            background: #cccaca; /* Background color of the scrollbar track */
            border-radius: 10px; /* Rounded corners for the scrollbar track */
        }

        #chat-content::-webkit-scrollbar-thumb {
            background: #161616; /* Color of the scrollbar thumb */
            border-radius: 10px; /* Rounded corners for the scrollbar thumb */
        }

        #chat-content::-webkit-scrollbar-thumb:hover {
            background: #0056b3; /* Color when hovering over the scrollbar thumb */
        }

        /* Custom scrollbar styling for Firefox */
        #chat-content {
            scrollbar-width: thin; /* Thin scrollbar */
            scrollbar-color: #161616 #cccaca; /* Thumb and track color */
        }
    </style>
</head>
<body>
    <div class="result-container">
        <h2>Research Classification Result</h2>
        <p>Predicted: <strong>{{ predicted_class }}</strong></p>
        <img class="image" src="{{ url_for('display_image', filename=filename) }}" alt="Captured Image">
        <p>Saliency map</p>
        <img class="image" src="{{ url_for('display_image', filename=saliency_filename) }}" alt="Saliency map">
        <div class="note">
            <p>This research prototype is not a medical diagnosis. Consult a qualified healthcare professional.</p>
        </div>
    </div>
    <div id="chat-icon" onclick="toggleChat()">💬</div>
    <div id="chat-window">
        <div id="chat-content"></div>
        <div style="display: flex; margin-top: auto;">
            <input type="text" id="chat-input" placeholder="Type your message..." onkeydown="handleKeyDown(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script>
        function toggleChat() {
            var chatWindow = document.getElementById('chat-window');
            chatWindow.style.display = chatWindow.style.display === 'none' ? 'flex' : 'none';
        }

        const csrfToken = "{{ csrf_token() }}";

        function addMessage(label, text, className) {
            const message = document.createElement('div');
            message.className = `message ${className}`;
            const strong = document.createElement('strong');
            strong.textContent = `${label}: `;
            message.appendChild(strong);
            message.appendChild(document.createTextNode(text));
            document.getElementById('chat-content').appendChild(message);
        }

        function sendMessage() {
            const inputElement = document.getElementById('chat-input');
            const input = inputElement.value;
            if (input.trim() === '') return; // Ignore empty input

            const chatContent = document.getElementById('chat-content');
            addMessage('You', input, 'user-message');

            // Send message to server
            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ message: input })
            })
            .then(async response => {
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Chat request failed.');
                return data;
            })
            .then(data => {
                addMessage('Bot', data.response, 'bot-message');
                chatContent.scrollTop = chatContent.scrollHeight;
            })
            .catch(error => addMessage('Error', error.message, 'bot-message'));

            // Clear input field
            inputElement.value = '';
        }
        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent form submission if inside a form
                sendMessage();
            }
        }
    </script>
</body>
</html>
