<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar h1 {
            color: #fff;
            font-size: 22px;
            margin: 0;
        }

        .navbar button {
            padding: 10px 15px;
            background-color: #6c5ce7;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .navbar button:hover {
            background-color: #4b4b7d;
        }

        .main-content {
            margin-top: 80px;
            text-align: center;
            color: #fff;
        }

        .main-content h1 {
            font-size: 32px;
            font-weight: 600;
        }

        .main-content h2 {
            font-size: 20px;
            margin-top: 5px;
            color: #dfe6e9;
        }

        .uploads-container {
            margin-top: 30px;
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .upload-card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }

        .upload-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .upload-card img {
            width: 100%;
            height: auto;
        }

        .upload-card .card-content {
            padding: 15px;
        }

        .upload-card .card-content p {
            margin: 5px 0;
            font-size: 14px;
            color: #2d3436;
            font-weight: 500;
        }

        .upload-card .saliency-map img {
            margin-top: 10px;
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .footer {
            margin-top: 30px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.1);
            color: #fff;
            width: 100%;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main-content h1 {
                font-size: 24px;
            }

            .main-content h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>User Dashboard</h1>
        <div>
            <a href="{{ url_for('upload_image') }}"><button type="button">Upload More</button></a>
            <form method="post" action="{{ url_for('logout') }}" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Logout</button>
            </form>
        </div>
    </div>

    <div class="main-content">
        <h1>Welcome, {{ username }}</h1>
        <h2>Here are your uploaded images and their analyses:</h2>
    </div>

    <div class="uploads-container">
        {% for upload in uploads %}
        <div class="upload-card">
            <img src="{{ url_for('display_image', filename=upload['filename']) }}" alt="Uploaded Image">
            <div class="card-content">
                <p><strong>Prediction:</strong> {{ upload['prediction'] }}</p>
                <p><strong>Date Uploaded:</strong> {{ upload['date_uploaded'] }}</p>
            </div>
            <div class="saliency-map">
                <p><strong>Saliency Map:</strong></p>
                <img src="{{ url_for('display_image', filename=upload['saliency_map']) }}" alt="Saliency Map">
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="footer">
        <p>&copy; 2024 Alzheimer's Prediction Dashboard | All Rights Reserved</p>
    </div>
</body>
</html>
