<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup | Alheimer Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        .title {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .signup-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90%;
            margin: auto;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #2d3436;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #74b9ff;
            box-shadow: 0 0 5px rgba(116, 185, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #4b4b7d;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        ul {
            margin-top: 15px;
            padding: 0;
            list-style-type: none;
        }

        li {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .error {
            background-color: #ff7675;
            color: white;
        }

        .success {
            background-color: #55efc4;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Alzherimer Detection</div>
        <div class="signup-container">
            <h2>Sign Up</h2>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="username" placeholder="Username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.-]+">
                <input type="password" name="password" placeholder="Password" required minlength="8">
                <button type="submit">Sign Up</button>
            </form>

            <div class="login-link">
                <p>Already have an account? <a href="/login">Login</a></p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                <ul>
                  {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                  {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}
        </div>
    </div>
</body>
</html>
